let S='intro',introT=0,si=0,pl,en,stage=1,Pj=[],Fx=[],fr=0,shake=0,msg='',mt=0,last=0,acc=0,flash=0;

const txt=(s,x,y,al,c,z)=>{X.font='bold '+z+'px system-ui,sans-serif';X.textAlign=al;X.fillStyle=c;X.fillText(s,x,y)},

function mk(r,x,f,ai,lv,bo){const h=ai?r.hp*(1+.2*lv)*(bo?1.5:1):r.hp;return{r,x,y:G,vx:0,vy:0,f,hp:h,mh:h,en:ai?0:30,st:'i',t:0,cb:0,form:0,sw:0,cbt:0,ai,lv,bo,inv:0,buf:0,ar:0,ul:0,tg:0,cc:0,cd:90,pl:'',pt:0,k:{},hs:0,did:0,mv:null,dm:ai?1+.09*lv:1}}
function nx(s){stage=s;en=mk(R[(si+1+(s-1)%(R.length-1))%R.length],780,-1,1,s-1,s%4==0);pl.x=180;pl.vx=pl.vy=0;pl.y=G;pl.st='i';pl.f=1;Pj=[];Fx=[];flash=0;msg='MÀN '+s+' — '+en.r.n+(en.bo?' (TRÙM)':'');mt=120}

function hit(t,s,d,kb,p,tu){if(t.inv>0||t.st=='d')return;
 let a=tu?d:d*s.r.at*s.dm*(s.buf>0?1.4:1)*t.r.df*(t.ar>0?.5:1);
 const bl=!tu&&t.st=='i'&&t.k.d&&t.y>=G&&(s.x>t.x?1:-1)==t.f&&p<8;
 if(bl){a*=.15;kb*=.3}else{t.st='h';t.t=0;t.hs=14+(p?8:0);t.cb=0;if(p)t.vy=-p}
 t.hp-=a;t.vx=(t.x>s.x?1:-1)*kb;t.inv=bl?4:9;
 if(!s.ul)s.en=M.min(100,s.en+8);
 sp(t.x,t.y-60,bl?5:14,bl?'#9cf':'#fd6');shake=bl?3:7+M.min(a/2,8);
 if(!bl&&(a>25||p>0||kb>10))flash=12; 
 if(t.hp<=0){t.hp=0;t.st='d';t.t=0;t.vy=-9;t.vx=(t.x>s.x?1:-1)*6}}

function go(f,i){f.st='a';f.t=0;f.did=0;f.ld=0;
 if(i<0){
  if(f.r.bs){f.mv={k:'proj',d:7,s:10,l:40,col:'#bf8',w:6,ar:1,fa:12,du:40}}
  else{f.mv={k:'b',a:4,e:12,w:60,d:f.r.tf&&f.form?(f.r.jd2||f.r.jd):f.r.jd,kb:7,p:0,du:16}}
  f.vx=0;
 }else{
  const m=(f.r.tf&&f.form?f.r.m2:f.r.m)[i];f.en-=m.c;f.mv=m;if(i>1)f.ul=100;
  m.du=m.du||{proj:22,dash:28,rise:32,slam:(m.wu||10)+20,buff:32,rain:30,dive:999,flurry:14+7*(m.q||7)+14,blink:28,sky:4+5*(m.q||12)+8,dragon_fire:30,dragon_blink:25,dragon_rush:35}[m.k]||30
 }}

function impact(f,o){const m=f.mv;ring(f.x,G,m.r);shake=14;flash=10;if(ab(o.x-f.x)<m.r&&o.y>G-90)hit(o,f,m.d,12,10);f.st='i';f.vx=0}

function act(f,o){const m=f.mv,t=++f.t,k=m.k,x=f.f,mel=(w,h,d,kb,p)=>{if(!f.did&&box(f,o,w,h)){hit(o,f,d,kb,p);f.did=1}};
 if(k=='b'){if(t>=m.a&&t<=m.e)mel(m.w,90,m.d,m.kb,m.p)}
 else if(k=='proj'){if(m.bk&&t>=2&&t<=14){f.vx=-x*m.bk;f.inv=2}if(t==(m.fa||8)){const q=m.q||1;for(let i=0;i<q;i++)Pj.push({x:f.x+x*30,y:f.y-65+(i-(q-1)/2)*(m.oy||0),vx:x*(m.s+i*(m.g||0)),vy:(i-(q-1)/2)*(m.sp||0),d:m.d,o:f,l:m.l,c:m.col,w:m.w,cr:m.cr,ar:m.ar,mh:m.mh})}}
 else if(k=='dash'){if(t>=3&&t<=20){f.vx=x*m.s;if(m.iv)f.inv=2;mel(60,90,m.d,9,0)}}
 else if(k=='rise'){if(t==3)f.vy=-16;if(t>=3&&t<=20){f.inv=2;mel(75,150,m.d,5,16)}}
 else if(k=='slam'){const u=m.wu||10;if(t==u)ring(f.x,f.y,m.r);if(t>=u&&t<=u+3&&!f.did&&ab(o.x-f.x)<m.r&&ab(o.y-f.y)<90){hit(o,f,m.d,10,8);f.did=1}}
 else if(k=='buff'){if(t==8){if(m.b)f.buf=m.b;if(m.a)f.ar=m.a;f.hp=M.min(f.mh,f.hp+m.h);ring(f.x,f.y-40,70);if(m.d&&ab(o.x-f.x)<120)hit(o,f,m.d,8,0)}}
 else if(k=='rain'){if(t==5)for(let i=0;i<m.q;i++)Pj.push({x:o.x+(i-(m.q-1)/2)*(m.sx||45)+(M.random()-.5)*20,y:-30-i*35,vx:0,vy:11,d:m.d,o:f,l:99,c:m.col||'#ddc',w:m.w||10})}
 else if(k=='dive'){if(t==1){f.vy=-16;f.vx=x*3}if(t==22){f.vy=19;f.vx=x*5}if(t>2)f.inv=2;if(t>22)mel(50,100,m.d*.5,6,0)}
 else if(k=='flurry'){f.inv=2;f.vx=0;if(t>=10)f.x=M.max(40,M.min(W-40,o.x-x*55));if(t==10)ring(f.x,f.y-40,70);if(t==14)f.tg=o.hp;const n=(t-14)/7;if(t>=14&&n%1==0&&n<m.q){const e=n==m.q-1,z=n%2?1:-1;o.inv=0;hit(o,f,m.d?m.d/m.q:f.tg*m.pc/m.q,e?12:2,e?10:0,1);Fx.push({k:'sl',x:o.x-z*45,y:o.y-115,x2:o.x+z*45,y2:o.y-15,l:10,ml:10,c:'#bdf'})}}
 else if(k=='blink'){if(t<=12)f.inv=2;if(t==3)ring(f.x,f.y-40,60);if(t==4){f.x=o.x;f.y=M.max(150,o.y-180);ring(f.x,f.y-40,60)}if(t>=4&&t<=22){f.vy=0;f.vx=0}if(t==10){const a=M.atan2(o.y-20-f.y,o.x-f.x);for(let i=0;i<m.q;i++){const b=a+(i-(m.q-1)/2)*.17;Pj.push({x:f.x,y:f.y-40,vx:M.cos(b)*15,vy:M.sin(b)*15,d:m.d,o:f,l:60,c:m.col,w:m.w,ar:1,mh:1})}}}
 else if(k=='sky'){f.inv=2;f.vx=0;if(t==1)f.tg=m.d?m.d/m.q:o.hp*m.pc/m.q;if(t==3)ring(f.x,f.y-40,60);const n=(t-4)/5;if(t>=4&&n%1==0&&n<m.q)Pj.push({x:o.x+(M.random()-.5)*24,y:-30,vx:0,vy:18,d:f.tg,o:f,l:99,c:m.col,w:m.w,ar:1,tu:1,mh:1,cc:1})}
 else if(k=='dragon_fire'){f.vx*=.5;if(t==6||t==12||t==18){Pj.push({x:f.x+x*35,y:f.y-65,vx:x*13,vy:(M.random()-.5)*1.5,d:m.d,o:f,l:45,c:'#fa3',w:10,mh:1});sp(f.x+x*30,f.y-65,4,'#fa3')}}
 else if(k=='dragon_blink'){if(t<=8)f.inv=2;if(t==1){ring(f.x,f.y-40,50);sp(f.x,f.y-40,8,'#f53')}if(t==4){f.f=o.x>f.x?-1:1;f.x=M.max(40,M.min(W-40,o.x-f.f*50));ring(f.x,f.y-40,50);sp(f.x,f.y-40,8,'#f53')}if(t>=10&&t<=15)mel(60,90,m.d,10,8)}
 else if(k=='dragon_rush'){f.inv=2;if(t==1){ring(f.x,f.y-40,70);f.vx=x*18}if(t>=2&&t<=28){if(fr%2==0)sp(f.x,f.y-40,3,'#f72');if(!f.did&&box(f,o,65,90)){if(o.y>=G-20){hit(o,f,m.d,14,12);f.did=1}}}}
 else if(k=='boom'){if(t==8)Pj.push({x:f.x+x*30,y:f.y-65,vx:0,vy:0,d:m.d,o:f,l:99,c:'#b8452e',w:13,mt:1,bm:1,bt:0,bl:m.bl,bs:m.s,dx:x,hh:0})}
 else if(k=='belly'){if(t<=12)f.inv=2;if(t==3){ring(f.x,f.y-40,60);sp(f.x,f.y-40,8,'#fff')}if(t==6){f.x=M.max(40,M.min(W-40,o.x));f.y=M.max(70,o.y-210);ring(f.x,f.y-40,60)}if(t>=6&&t<20){f.vy=0;f.vx=0;f.x+=(o.x-f.x)*.25}if(t==20)f.vy=24;if(t>20&&!f.did&&ab(o.x-f.x)<55&&f.y>o.y-105){hit(o,f,m.d,12,12);f.did=1;sp(o.x,o.y-80,12,'#fd6')}if(t>20&&f.y>=G&&!f.ld){f.ld=1;ring(f.x,G,90);shake=12}}
 else if(k=='suck'){f.vx=0;if(t==1){f.sk=ab(o.x-f.x)<m.r;if(!f.sk&&!f.ai){msg='Quá xa — không hút được!';mt=50}}
  if(f.sk&&o.st!='d'){if(t>=6&&t<=m.pe+4){o.st='h';o.t=0;o.hs=3;o.vx=0;if(t<=m.pe){o.x+=(f.x+x*58-o.x)*.2;if(t%2==0)Fx.push({x:o.x,y:o.y-60,vx:(f.x+x*30-o.x)*.1,vy:-1,l:12,ml:12,c:'#fff',s:3})}}
   if(t==m.pe-14)Fx.push({k:'bm',x:o.x,y:o.y,l:18,ml:18});
   if(t==m.pe+4&&!f.did&&ab(o.x-f.x)<100&&ab(o.y-f.y)<110){hit(o,f,m.d,16,12);f.did=1;flash=10}}}
 else if(k=='launch'){if(t<=8)f.inv=2;if(t==1){ring(f.x,f.y-40,50);sp(f.x,f.y-40,8,'#9fdcff')}if(t==4){f.f=o.x>f.x?1:-1;f.x=M.max(40,M.min(W-40,o.x-f.f*48));f.y=o.y;ring(f.x,f.y-40,50);sp(f.x,f.y-40,8,'#9fdcff')}if(t>=10&&t<=15)mel(60,90,m.d,6,18)}
 else if(k=='buttbite'){if(t<=8)f.inv=2;if(t==1){ring(f.x,f.y-30,45);sp(f.x,f.y-30,8,'#666')}if(t==4){f.x=M.max(40,M.min(W-40,o.x-(o.f||1)*52));f.f=o.x>f.x?1:-1;ring(f.x,f.y-30,45);sp(f.x,f.y-30,8,'#666')}if(t>=9&&t<=14)mel(55,70,m.d,13,9)}
 if(k!='dive'&&(m.du&&t>=m.du))f.st='i'}

function brain(f,o){const k={},d=o.x-f.x,ad=ab(d),tw=d>0?'r':'l',aw=d>0?'l':'r',L=f.lv;
 if(f.cd>0)f.cd--;
 if(o.st=='a'&&ad<160&&f.y>=G&&f.pl!='blk'&&M.random()<.012*L+.01){f.pl='blk';f.pt=0;f.cd=20}
 else if(f.cd<=0){f.cd=(34-L*2.5)*(.5+M.random());const r=M.random();
  f.pl=f.en>=100&&r<.7?'ult':ad>300?(r<.35?'p0':r<.5?'p1':'adv'):ad>120?(r<.3?'adv':r<.45?'p0':r<.6?'p1':r<.75?'jmp':r<.85?'blk':'aw'):(r<.5?'atk':r<.6?'p0':r<.72?'p1':r<.85?'blk':'aw');f.pt=0}
 f.pt++;const p=f.pl;
 if(p=='adv')k[tw]=1;else if(p=='aw')k[aw]=1;else if(p=='blk')k.d=1;
 else if(p=='atk'){if(ad>70)k[tw]=1;if(f.pt%9==3)k.j=1}
 else if(p=='p0'&&f.pt==2){k.s1=1}else if(p=='p1'&&f.pt==2){k.s2=1}else if(p=='ult'&&f.pt==2){k.s3=1}
 else if(p=='jmp'){if(f.pt==1)k.sp=1;if(f.y<G&&f.pt%7==0&&M.random()<.4)k.j=1}
 if(f.r.tf&&f.sw<=0&&M.random()<.008)k.s3=1;return k}

function upd(f,o){const k=f.st=='d'?{}:f.ai?brain(f,o):{l:K.KeyA,r:K.KeyD,u:K.KeyW,d:K.KeyS,sp:K.Space,j:J.KeyJ,s1:J.KeyU,s2:J.KeyI,s3:J.KeyO},r=f.r,air=f.y<G;f.k=k;
 if(f.inv>0)f.inv--;if(f.sw>0)f.sw--;if(f.buf>0)f.buf--;if(f.cbt>0)f.cbt--;else f.cb=0;
 if(f.ul>0)f.ul--;if(f.ar>0)f.ar--;if(f.cc>0)f.cc--;
 if(f.st=='d')f.t++;
 else if(f.st=='h'){if(++f.t>f.hs)f.st='i'}
 else if(f.st=='i'){f.f=o.x>f.x?1:-1;const v=r.sp*(f.ai?1+.03*f.lv:1)*(r.tf&&f.form?1.25:1);
  f.vx=k.d&&!air?0:((k.r?1:0)-(k.l?1:0))*v;
  if(k.sp&&!air)f.vy=-r.jp;
  if(k.s3&&r.tf){if(f.sw<=0){f.form=f.form?0:1;f.sw=45;f.inv=8;ring(f.x,f.y-40,70);sp(f.x,f.y-40,16,f.form?'#222':'#9fdcff');if(!f.ai){msg=f.form?'DẠNG CHÓ ĐEN!':'DẠNG NGƯỜI!';mt=45}}}
   else if(k.s3&&f.en>=100)go(f,2);else if(k.s1&&f.en>=r.m[0].c)go(f,0);else if(k.s2&&f.en>=r.m[1].c)go(f,1);else if(k.j)go(f,-1);}
 else act(f,o);
 f.x+=f.vx;f.y+=f.vy;
 if(f.y<G||f.vy<0)f.vy+=f.st=='a'&&f.mv.k=='rain'?.1:.7;
 if(f.y>=G){f.y=G;if(f.vy>0){f.vy=0;if(f.st=='a'&&f.mv.k=='dive')impact(f,o)}}
